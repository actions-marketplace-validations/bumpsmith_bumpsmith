name: Feature request
description: An upgrade Bumpsmith should handle, or something the dashboard should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help }
  - type: input
    id: example
    attributes:
      label: An example upgrade or repository (if any)
      placeholder: "prisma 5 → 6 in github.com/acme/api"
